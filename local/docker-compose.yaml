services:
  api-server:
    # No platform flag needed anymore! 2.21.0+ supports ARM64 (M4)
    image: azbuilder/api-server:latest
    container_name: api-server
    ports:
      - "8080:8080"
    networks:
      - azbuilder-backend
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:terrakube
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.H2Dialect

  ui:
    image: azbuilder/terrakube-ui:latest
    container_name: ui
    ports:
      - "3000:3000"
    networks:
      - azbuilder-backend
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:8080

  executor:
    image: azbuilder/executor:latest
    container_name: executor
    networks:
      - azbuilder-backend
    restart: unless-stopped
    environment:
      - TERRAKUBE_API_URL=http://api-server:8080

networks:
  azbuilder-backend:
    name: azbuilder-backend